# Sveltia CMS config — git-backed editorial workflow, no database.
#
# OAuth provider: shared with CenTex Press. Both publications authenticate
# through the same Cloudflare Worker (repo cryptoqueen23/CenTexPress,
# workers/cms-auth) rather than each running its own — it's generic (gated
# only by an ALLOWED_DOMAINS allowlist on the worker side, not by any
# CenTex-specific code) and one shared OAuth app is less to maintain than
# one per publication. If you ever add a third Sveltia-backed site, add its
# domain to that worker's ALLOWED_DOMAINS var rather than deploying another.

backend:
  name: github
  repo: cryptoqueen23/wmag
  branch: main
  base_url: https://centex-press-cms-auth.truewolfflix777.workers.dev

local_backend: true

media_folder: "public/images/stories"
public_folder: "/images/stories"

collections:
  - name: stories
    label: Stories
    label_singular: Story
    folder: src/content/stories
    create: true
    slug: "{{slug}}"
    format: frontmatter
    extension: md
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Dek, name: dek, widget: text, hint: "One-sentence summary shown on cards and in search results." }
      - label: Department
        name: department
        widget: select
        options:
          - Style
          - Beauty
          - Home
          - Food
          - Wellness
          - "Love & Family"
          - Money
          - Work
          - Travel
          - Culture
          - Faith
          - Life
          - Politics
          - Voices
      - label: Content Type
        name: contentType
        widget: select
        hint: "News/Explainer/Analysis/Opinion are distinct — keep reporting and argument clearly separated."
        options:
          - News
          - Feature
          - Longform
          - Interview
          - Essay
          - Explainer
          - Analysis
          - Opinion
          - Guide
          - Review
          - Recipe
          - "Shopping Edit"
          - "Photo Essay"
      - { label: Author, name: author, widget: string }
      - { label: Publish Date, name: publishDate, widget: datetime }
      - { label: Featured on Homepage, name: featured, widget: boolean, default: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Image Alt Text, name: imageAlt, widget: string, required: false, hint: "Required for accessibility if an image is set." }
      - { label: Issue, name: issue, widget: string, required: false, hint: "e.g. beauty — links this story to a themed issue package." }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Body, name: body, widget: markdown }
